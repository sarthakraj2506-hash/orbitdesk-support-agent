[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitdesk-support-agent"
version = "0.1.0"
description = "Local-first OrbitDesk support agent network (Tantrabodh AI internship assignment)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "transformers>=4.44.0",
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
  "jsonschema>=4.22.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "matplotlib>=3.8.0",
  "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
orbitdesk-agent = "orbitdesk_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
